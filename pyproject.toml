[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "BaekHyoYoung", email = "108615164+HyoYoung0829@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "supabase>=2.32.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]  # I = import 순서 자동 정렬

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
