[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "BaekHyoYoung", email = "108615164+HyoYoung0829@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1,<2",
    "fastapi>=0.143.1",
    "httpx2>=2.16.0",
    "langgraph>=1,<2",
    "markdown-it-py>=4,<5",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<0.12",
    "pydantic-settings>=2.16.0",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.2.4",
    "supabase>=2.32.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
    "pytest>=9.1.1",
    "reportlab>=4,<5",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]  # I = import 순서 자동 정렬

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
