# EC2 배포용. 프론트는 Vercel에 있어서 백엔드와 HTTPS 프록시만 띄운다.
# 실행: docker compose -f docker-compose.aws.yml up -d --build
# 로컬 간이 배포와 비상용은 docker-compose.yml을 그대로 쓴다.
services:
  backend:
    build: .
    restart: unless-stopped
    # 비밀값과 CORS_ORIGINS(Vercel 주소)는 서버의 .env에서 주입한다
    env_file: .env
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서를 볼륨에 둬서 컨테이너를 다시 만들어도 재발급하지 않게 한다
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
